name: CI

on:
  push:
    branches: [main, 'codex/lesson-desk-*-macos']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check public repository contents
        run: npm run check:public
      - name: Run local tests
        run: npm test
      - name: Build desktop application
        if: ${{ !endsWith(github.ref_name, '-macos') }}
        run: npm run build
      - name: Check the same packaged workflows on Windows
        if: ${{ endsWith(github.ref_name, '-macos') }}
        shell: pwsh
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          node scripts/packaged-desktop-smoke.mjs "release/$version/win-unpacked/讲题工作台.exe"
